<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Hub Portal</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
            <a href="contact.html">Contact</a>
            <a href="FAQ.html">FAQ</a>
        </nav>
    </header>

    <main>

        <div class="form-container">

            <h2>Student Registration</h2>

            <form action="dashboard.html">

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="enrolnum">Enrollment Number:</label>
                    <input type="number" id="enrolnum" required>
                </div>

                <div class="form-group">
                    <label for="pass">Password:</label>
                    <input type="password" id="pass" required>
                </div>

                <div class="form-group">
                    <label for="confirm-pass">Confirm Password:</label>
                    <input type="password" id="confirm-pass" required>
                </div>

                <input type="submit" value="Register" class="form-button">

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Student Hub Portal. All Rights Reserved.</p>
    </footer>

</body>

</html>
